name: Screenshots

# Starts the examples on a macOS runner, drives them from code and uploads screenshots.
# Run it by hand: Actions > Screenshots > Run workflow.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  shoot:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install -e .
      - name: Show the display
        run: |
          sw_vers
          system_profiler SPDisplaysDataType | head -20 || true
      - name: Take screenshots
        run: |
          mkdir -p shots
          status=0
          for appearance in "" "--dark"; do
            for scenario in hello settings widgets finder sidebar everything editor form progress tasks; do
              echo "=== $scenario $appearance"
              python tools/shoot.py "$scenario" shots $appearance 2>&1 | tee -a shots/log.txt || status=1
            done
          done
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: shots
          if-no-files-found: warn
      - name: Publish the images to the ci-screenshots branch
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan ci-screenshots
          git rm -rf -q . || true
          git add -f shots
          git commit -q -m "Screenshots from run ${{ github.run_id }}"
          git push -f origin ci-screenshots
