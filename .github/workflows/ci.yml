name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # Linux runs the pure-Python tests; the macOS runners also build real AppKit views.
        # Check the runner labels when GitHub retires one (macos-15-intel is the Intel image).
        os: [ubuntu-latest, macos-latest, macos-15-intel]
        python-version: ["3.10", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[test]"
      - name: Run tests
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -v -rfE --tb=short 2>&1 | tee pytest.log
      - name: Show failures as annotations
        if: failure()
        shell: bash
        run: |
          # Failures appear in the job's annotations, so they can be read without the full log.
          python - <<'PY'
          import re
          text = open("pytest.log").read()
          start = text.find("= FAILURES =")
          chunk = text[start:] if start >= 0 else text[-4000:]
          chunk = re.sub(r"\n{2,}", "\n", chunk)[:3500]
          print("::error title=pytest::" + chunk.replace("%", "%25").replace("\r", "").replace("\n", "%0A"))
          PY

  package:
    # The wheel must install and import on a machine without AppKit.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m compileall -q baremacgui examples tools
      - run: python -m pip install build
      - run: python -m build
      - name: Install the wheel into a clean environment and import it
        run: |
          python -m venv /tmp/wheel-env
          /tmp/wheel-env/bin/pip install dist/*.whl
          cd /tmp && /tmp/wheel-env/bin/python -c "import baremacgui, sys; print(baremacgui.__version__); assert 'AppKit' not in sys.modules"
      - name: Wheel and sdist contain what they should
        run: |
          python - <<'PY'
          import glob, zipfile
          names = zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist()
          assert any(n.endswith("baremacgui/__init__.py") for n in names), names
          assert any(n.endswith("LICENSE") for n in names), names
          print(len(names), "files in the wheel")
          PY
