name: Bug report
description: Something looks wrong or does not work (macOS)
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, what happened instead? A screenshot helps a lot.
    validations:
      required: true
  - type: textarea
    id: code
    attributes:
      label: Minimal code
      description: The smallest script that shows the problem.
      render: python
  - type: input
    id: version
    attributes:
      label: BareMacGUI version
      placeholder: "0.1.0b1"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and chip
      placeholder: "macOS 15.5, Intel"
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python and PyObjC version
      placeholder: "Python 3.14, PyObjC 12.2"
